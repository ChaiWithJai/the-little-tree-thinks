name: Creative evaluation proof

on:
  pull_request:
    paths:
      - ".github/workflows/creative-evaluation-proof.yml"
      - "docs/evaluation/**"
      - "scripts/validate_creative_evaluation.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/creative-evaluation-proof.yml"
      - "docs/evaluation/**"
      - "scripts/validate_creative_evaluation.py"

permissions:
  contents: read

jobs:
  validate-proof-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate evidence, arithmetic, and retained hashes
        run: python3 scripts/validate_creative_evaluation.py
