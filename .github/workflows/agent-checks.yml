name: Agent checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python3 -m pip install -r requirements.txt
      - name: Python contracts
        run: python3 -m unittest discover -s tests -v
      - name: Browser state contracts
        run: |
          node --check web/app.js
          node tests/test_fsm.js
      - name: Creative proof bundle
        run: python3 scripts/validate_creative_evaluation.py
